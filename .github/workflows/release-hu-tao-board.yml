name: Release Hu Tao Board

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HU_TAO_KEYSTORE_PATH: ${{ runner.temp }}/hu-tao-board-release.jks
      HU_TAO_KEYSTORE_PASSWORD: ${{ secrets.HU_TAO_KEYSTORE_PASSWORD }}
      HU_TAO_KEY_ALIAS: ${{ secrets.HU_TAO_KEY_ALIAS }}
      HU_TAO_KEY_PASSWORD: ${{ secrets.HU_TAO_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          HU_TAO_KEYSTORE_BASE64: ${{ secrets.HU_TAO_KEYSTORE_BASE64 }}
        run: |
          set -eu
          : "${HU_TAO_KEYSTORE_BASE64:?Missing HU_TAO_KEYSTORE_BASE64 secret}"
          : "${HU_TAO_KEYSTORE_PASSWORD:?Missing HU_TAO_KEYSTORE_PASSWORD secret}"
          : "${HU_TAO_KEY_ALIAS:?Missing HU_TAO_KEY_ALIAS secret}"
          : "${HU_TAO_KEY_PASSWORD:?Missing HU_TAO_KEY_PASSWORD secret}"
          printf '%s' "$HU_TAO_KEYSTORE_BASE64" | base64 --decode > "$HU_TAO_KEYSTORE_PATH"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify and checksum APK
        id: apk
        run: |
          set -eu
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Hu Tao Board ${GITHUB_REF_NAME#v}"
          fi
